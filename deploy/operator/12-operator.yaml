apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks-ui-k8s-operator
  namespace: healthchecks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthchecks-ui-k8s-operator
  template:
    metadata:
      labels:
        app: healthchecks-ui-k8s-operator
    spec:
      serviceAccountName: healthchecks-admin
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthchecks-ui-k8s-operator
          image: ghcr.io/dotnetdiag/healthchecksui-k8s-operator:latest
          imagePullPolicy: Always
          env:
            - name: HealthChecksOperator__DefaultUIImage
              value: ghcr.io/dotnetdiag/healthchecksui:latest
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -r /proc/1/stat
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -r /proc/1/stat
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 100Mi
              cpu: 300m
            limits:
              memory: 200Mi
              cpu: 500m
