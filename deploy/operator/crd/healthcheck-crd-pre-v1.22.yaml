apiVersion: apiextensions.k8s.io/v1beta1
kind: CustomResourceDefinition
metadata:
  name: healthchecks.aspnetcore.ui
spec:
  group: aspnetcore.ui
  names:
    plural: healthchecks
    singular: healthcheck
    kind: HealthCheck
    listKind: HealthChecks
    shortNames:
      - hc
  scope: Namespaced
  subresources:
    status: {}
  versions:
    - name: v1
      served: true
      storage: true
  validation:
    openAPIV3Schema:
      type: object
      properties:
        spec:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            scope:
              type: string
              default: Cluster
              enum:
                - Cluster
                - Namespaced
            serviceType:
              type: string
              default: ClusterIP
              enum:
                - ClusterIP
                - LoadBalancer
                - NodePort
            portNumber:
              type: integer
              default: 8080
              minimum: 1
              maximum: 65535
            uiPath:
              type: string
              default: /healthchecks
              pattern: "^/.*"
            uiApiPath:
              type: string
              pattern: "^/.*"
            uiResourcesPath:
              type: string
              pattern: "^/.*"
            uiWebhooksPath:
              type: string
              pattern: "^/.*"
            uiNoRelativePaths:
              type: boolean
            servicesLabel:
              type: string
              default: HealthChecks
              minLength: 1
            healthChecksPath:
              type: string
              default: health
              minLength: 1
            healthChecksScheme:
              type: string
              default: http
              enum:
                - http
                - https
            image:
              type: string
              minLength: 1
            imagePullPolicy:
              type: string
              default: Always
              enum:
                - Always
                - IfNotPresent
                - Never
            stylesheetContent:
              type: string
              default: ""
            livenessProbe:
              type: object
              properties:
                path:
                  type: string
                  default: /healthz
                  pattern: "^/.*"
                initialDelaySeconds:
                  type: integer
                  minimum: 0
                periodSeconds:
                  type: integer
                  minimum: 1
                timeoutSeconds:
                  type: integer
                  minimum: 1
                failureThreshold:
                  type: integer
                  minimum: 1
            readinessProbe:
              type: object
              properties:
                path:
                  type: string
                  default: /healthz
                  pattern: "^/.*"
                initialDelaySeconds:
                  type: integer
                  minimum: 0
                periodSeconds:
                  type: integer
                  minimum: 1
                timeoutSeconds:
                  type: integer
                  minimum: 1
                failureThreshold:
                  type: integer
                  minimum: 1
            resources:
              type: object
              properties:
                limits:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                requests:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
            serviceAnnotations:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  value:
                    type: string
                required:
                  - name
                  - value
            deploymentAnnotations:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  value:
                    type: string
                required:
                  - name
                  - value
            deployAnnotations:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  value:
                    type: string
                required:
                  - name
                  - value
            webhooks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                  uri:
                    type: string
                    minLength: 1
                  payload:
                    type: string
                  restoredPayload:
                    type: string
                required:
                  - name
                  - uri
            tolerations:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  operator:
                    type: string
                    enum:
                      - Exists
                      - Equal
                  value:
                    type: string
                  effect:
                    type: string
                    enum:
                      - NoSchedule
                      - PreferNoSchedule
                      - NoExecute
                  seconds:
                    type: integer
                    minimum: 0
          required:
            - name
        status:
          type: object
          properties:
            phase:
              type: string
            message:
              type: string
            observedGeneration:
              type: integer
            deploymentName:
              type: string
            serviceName:
              type: string
            availableReplicas:
              type: integer
            lastTransitionTime:
              type: string
              format: date-time
