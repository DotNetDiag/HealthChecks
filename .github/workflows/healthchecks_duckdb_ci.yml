name: HealthChecks DuckDB CI

permissions:
  contents: read
  packages: write


on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - src/HealthChecks.DuckDb/**
      - test/HealthChecks.DuckDb.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_duckdb_ci.yml
      - .github/workflows/reusable_ci_workflow.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
    tags:
      - v*

  pull_request:
    branches: [ master ]
    paths:
      - src/HealthChecks.DuckDb/**
      - test/HealthChecks.DuckDb.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_duckdb_ci.yml
      - .github/workflows/reusable_ci_workflow.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props

jobs:
  build:
    uses: ./.github/workflows/reusable_ci_workflow.yml
    secrets: inherit
    with:
      PROJECT_PATH: ./src/HealthChecks.DuckDb/HealthChecks.DuckDb.csproj
      TEST_PROJECT_PATH: ./test/HealthChecks.DuckDb.Tests/HealthChecks.DuckDb.Tests.csproj
      CODECOV_FLAGS: DuckDb
