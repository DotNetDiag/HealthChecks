name: HealthChecks Artemis CI

permissions:
  contents: read
  packages: write


on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - src/HealthChecks.Artemis/**
      - test/HealthChecks.Artemis.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_artemis_ci.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
    tags:
      - v*

  pull_request:
    branches: [master]
    paths:
      - src/HealthChecks.Artemis/**
      - test/HealthChecks.Artemis.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_artemis_ci.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props

jobs:
  build:
    uses: ./.github/workflows/reusable_ci_workflow.yml
    secrets: inherit
    with:
      PROJECT_PATH: ./src/HealthChecks.Artemis/HealthChecks.Artemis.csproj
      TEST_PROJECT_PATH: ./test/HealthChecks.Artemis.Tests/HealthChecks.Artemis.Tests.csproj
      CODECOV_FLAGS: Artemis
