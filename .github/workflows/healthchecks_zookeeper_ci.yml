name: HealthChecks ZooKeeper CI

permissions:
  contents: read
  packages: write


on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - src/HealthChecks.ZooKeeper/**
      - test/HealthChecks.ZooKeeper.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_zookeeper_ci.yml
      - .github/workflows/reusable_ci_workflow.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
    tags:
      - v*

  pull_request:
    branches: [ master ]
    paths:
      - src/HealthChecks.ZooKeeper/**
      - test/HealthChecks.ZooKeeper.Tests/**
      - test/_SHARED/**
      - .github/workflows/healthchecks_zookeeper_ci.yml
      - .github/workflows/reusable_ci_workflow.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props

jobs:
  build:
    uses: ./.github/workflows/reusable_ci_workflow.yml
    secrets: inherit
    with:
      PROJECT_PATH: ./src/HealthChecks.ZooKeeper/HealthChecks.ZooKeeper.csproj
      TEST_PROJECT_PATH: ./test/HealthChecks.ZooKeeper.Tests/HealthChecks.ZooKeeper.Tests.csproj
      CODECOV_FLAGS: ZooKeeper
